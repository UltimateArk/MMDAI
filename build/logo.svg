<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#003D7A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00A89F;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="60" rx="8" fill="url(#logoGradient)"/>
  
  <!-- Company initials or text -->
  <text x="100" y="42" font-size="32" font-weight="bold" fill="white" text-anchor="middle" font-family="Arial, sans-serif">MM</text>
  
  <!-- Subtitle -->
  <text x="100" y="58" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle" font-family="Arial, sans-serif">SERVICES</text>
</svg>
